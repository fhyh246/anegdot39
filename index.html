<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PENTAGON BREAKER: FIX</title>
    <style>
        :root { --neon: #00ff41; --dark: #050505; --red: #ff3300; }
        body { background: var(--dark); color: var(--neon); font-family: monospace; margin: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        
        .header { padding: 10px; border-bottom: 2px solid var(--neon); display: flex; justify-content: space-between; background: #000; font-size: 12px; }
        .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; padding: 15px; background: rgba(0,20,0,0.5); text-align: center; border-bottom: 1px solid var(--neon); }
        .val { font-size: 18px; font-weight: bold; display: block; }
        .label { font-size: 10px; opacity: 0.7; }

        .main { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        #hack-btn { width: 160px; height: 160px; border-radius: 50%; border: 3px solid var(--neon); background: none; color: var(--neon); font-size: 24px; font-weight: bold; cursor: pointer; box-shadow: 0 0 15px var(--neon); transition: 0.1s; }
        #hack-btn:active { background: var(--neon); color: #000; transform: scale(0.95); }

        .temp-box { width: 200px; margin-top: 20px; text-align: center; }
        .bar-bg { width: 100%; height: 8px; background: #222; border: 1px solid var(--neon); margin-top: 5px; }
        #temp-bar { width: 0%; height: 100%; background: var(--neon); transition: 0.1s; }

        .shop { height: 40vh; background: rgba(0,10,0,0.9); border-top: 2px solid var(--neon); overflow-y: auto; padding: 10px; }
        .item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #003300; }
        .item-info h4 { margin: 0; font-size: 14px; }
        .item-info p { margin: 0; font-size: 10px; color: #008800; }
        .buy-btn { background: var(--neon); color: #000; border: none; padding: 8px 12px; font-weight: bold; cursor: pointer; }
        .buy-btn:disabled { background: #003300; color: #005500; cursor: not-allowed; }

        .glitch { animation: shake 0.1s infinite; }
        @keyframes shake { 0% { transform:translate(2px,1px); } 50% { transform:translate(-2px,-1px); } 100% { transform:translate(1px,2px); } }
        
        #ach-notify { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); background: var(--neon); color: #000; padding: 10px; display: none; z-index: 1000; font-weight: bold; border: 2px solid #fff; }
    </style>
</head>
<body>

<div id="ach-notify">ОТЧИВКА РАЗБЛОКИРОВАНА!</div>

<div class="header">
    <span>СИСТЕМА: АКТИВНА</span>
    <span id="save-status">V1.2.0</span>
</div>

<div class="stats">
    <div><span class="label">БИТКОИНЫ</span><span class="val" id="btc">0.000000</span></div>
    <div><span class="label">ДАННЫЕ (GB)</span><span class="val" id="data">0.00</span></div>
    <div><span class="label">КУРС BTC/GB</span><span class="val" id="rate">1.00</span></div>
</div>

<div class="main" id="screen">
    <button id="hack-btn" onclick="hack(event)">ВЗЛОМ</button>
    <div class="temp-box">
        <span class="label">ТЕМПЕРАТУРА: <span id="temp-val">30</span>°C</span>
        <div class="bar-bg"><div id="temp-bar"></div></div>
    </div>
</div>

<div class="shop" id="shop">
    </div>

<script>
    let state = {
        btc: 0,
        data: 0,
        rate: 1.0,
        temp: 30,
        clickPower: 0.00001,
        autoData: 0,
        cooling: 0.2,
        multiplier: 1,
        achieved: []
    };

    const upgrades = [
        { id: 'gpu', name: 'Видеокарта RTX 9090', desc: '+BTC за клик', cost: 0.0001, type: 'btc' },
        { id: 'ram', name: 'Модуль RAM', desc: 'Удвоить множитель', cost: 0.002, type: 'btc' },
        { id: 'cooler', name: 'Жидкий Азот', desc: 'Быстрое охлаждение', cost: 0.0005, type: 'btc' },
        { id: 'bot', name: 'Ботнет-ферма', desc: 'Авто-данные (GB)', cost: 100, type: 'data' }
    ];

    function hack(e) {
        if (state.temp >= 100) return;

        state.btc += state.clickPower * state.multiplier;
        state.data += 0.5 * state.multiplier;
        state.temp += 2;

        if (navigator.vibrate) navigator.vibrate(20);
        
        document.getElementById('screen').classList.add('glitch');
        setTimeout(() => document.getElementById('screen').classList.remove('glitch'), 100);

        checkAch();
        updateUI();
    }

    function buy(index) {
        const item = upgrades[index];
        const currency = item.type;

        if (state[currency] >= item.cost) {
            state[currency] -= item.cost;
            
            if (item.id === 'gpu') state.clickPower += 0.00002;
            if (item.id === 'ram') state.multiplier *= 2;
            if (item.id === 'cooler') state.cooling += 0.3;
            if (item.id === 'bot') state.autoData += 5;

            item.cost *= 1.7;
            save();
            renderShop();
            updateUI();
        }
    }

    function updateUI() {
        document.getElementById('btc').innerText = state.btc.toFixed(6);
        document.getElementById('data').innerText = state.data.toFixed(2);
        document.getElementById('rate').innerText = state.rate.toFixed(2);
        document.getElementById('temp-val').innerText = Math.floor(state.temp);
        document.getElementById('temp-bar').style.width = state.temp + "%";
        
        if (state.temp > 80) document.getElementById('temp-bar').style.background = "red";
        else document.getElementById('temp-bar').style.background = "var(--neon)";
    }

    function renderShop() {
        const shop = document.getElementById('shop');
        shop.innerHTML = '';
        upgrades.forEach((item, i) => {
            const canAfford = state[item.type] >= item.cost;
            shop.innerHTML += `
                <div class="item">
                    <div class="item-info">
                        <h4>${item.name}</h4>
                        <p>${item.desc}</p>
                    </div>
                    <button class="buy-btn" ${canAfford ? '' : 'disabled'} onclick="buy(${i})">
                        ${item.cost.toFixed(item.type === 'btc' ? 5 : 0)} ${item.type.toUpperCase()}
                    </button>
                </div>
            `;
        });
    }

    function checkAch() {
        if (state.btc >= 0.001 && !state.achieved.includes('rich')) {
            showAch("ПЕРВЫЙ КЭШ: Накоплено 0.001 BTC");
            state.achieved.push('rich');
        }
        if (state.temp >= 95 && !state.achieved.includes('hot')) {
            showAch("НА ГРАНИ: Температура 95°C+");
            state.achieved.push('hot');
        }
    }

    function showAch(text) {
        const n = document.getElementById('ach-notify');
        n.innerText = text;
        n.style.display = 'block';
        setTimeout(() => n.style.display = 'none', 3000);
    }

    function save() { localStorage.setItem('hackerSave', JSON.stringify({state, upgrades})); }
    function load() {
        const d = localStorage.getItem('hackerSave');
        if (d) {
            const p = JSON.parse(d);
            state = p.state;
            p.upgrades.forEach((u, i) => upgrades[i].cost = u.cost);
        }
    }

    // Игровой цикл
    setInterval(() => {
        // Охлаждение
        state.temp = Math.max(30, state.temp - state.cooling);
        // Авто-данные
        state.data += state.autoData / 10;
        // Курс
        state.rate = Math.max(0.5, Math.min(3.0, state.rate + (Math.random() - 0.5) * 0.1));
        
        if (state.temp >= 100) {
            state.temp = 30;
            alert("СИСТЕМА ПЕРЕГРЕТА! ПЕРЕЗАГРУЗКА...");
        }

        updateUI();
    }, 100);

    // Автосохранение
    setInterval(save, 5000);

    load();
    renderShop();
</script>

</body>
</html>
