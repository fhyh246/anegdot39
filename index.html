<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HACKER PATH: EVOLUTION</title>
    <style>
        :root { --neon: #00ff41; --dark: #050505; --gold: #ffd700; --red: #ff3131; --blue: #00d4ff; }
        body { background: var(--dark); color: var(--neon); font-family: 'Courier New', monospace; margin: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        
        /* Шкалы и Статы */
        .header { padding: 10px; border-bottom: 2px solid var(--neon); display: flex; justify-content: space-between; background: #000; font-size: 12px; }
        .stats-bar { display: grid; grid-template-columns: 1fr 1fr; padding: 10px; background: rgba(0,30,0,0.5); gap: 10px; border-bottom: 1px solid var(--neon); }
        .val { font-size: 16px; font-weight: bold; }
        .rub { color: var(--gold); }
        
        /* Локация */
        .location-info { padding: 5px 10px; background: #111; font-size: 11px; color: var(--blue); border-bottom: 1px solid var(--blue); text-align: center; }

        /* Центр */
        .main-hub { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        #hack-btn { 
            width: 130px; height: 130px; border-radius: 50%; border: 3px solid var(--neon); 
            background: none; color: var(--neon); font-size: 18px; font-weight: bold; 
            cursor: pointer; box-shadow: 0 0 15px var(--neon); z-index: 5;
        }
        #hack-btn:active { transform: scale(0.9); background: var(--neon); color: #000; }
        
        /* Термометр */
        .temp-wrapper { width: 200px; margin-top: 15px; text-align: center; }
        .temp-bg { width: 100%; height: 6px; background: #222; border: 1px solid var(--neon); border-radius: 3px; }
        #temp-fill { width: 0%; height: 100%; background: var(--neon); transition: 0.1s; }

        /* Квесты */
        .quest-box { width: 90%; background: rgba(0,40,0,0.8); border: 1px solid var(--blue); margin: 10px auto; padding: 8px; font-size: 11px; }

        /* Магазин */
        .bottom-panel { height: 40vh; background: #000; border-top: 2px solid var(--neon); overflow-y: auto; padding: 10px; }
        .upgrade-card { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px dotted #004400; }
        .u-name { font-size: 13px; color: var(--gold); margin: 0; }
        .u-desc { font-size: 10px; color: #008800; margin: 2px 0; }
        .buy-btn { background: var(--neon); color: #000; border: none; padding: 6px 10px; font-weight: bold; cursor: pointer; border-radius: 3px; }
        .buy-btn:disabled { opacity: 0.2; cursor: not-allowed; }

        /* Анимация критического перегрева */
        .overheat { animation: shake 0.1s infinite; border-color: var(--red) !important; color: var(--red) !important; box-shadow: 0 0 30px var(--red) !important; }
        @keyframes shake { 0% { transform: translate(1px, 1px); } 50% { transform: translate(-1px, -1px); } 100% { transform: translate(1px, -1px); } }
    </style>
</head>
<body>

<div class="header">
    <span id="loc-name">ПОДВАЛ МАМКИ</span>
    <span id="income-display">0 ₽/с</span>
</div>

<div class="location-info" id="loc-bonus">Бонус: Охлаждение +0% | Налог: 0%</div>

<div class="stats-bar">
    <div><small>КРИПТА:</small><br><span class="val" id="btc-val">0.00000</span></div>
    <div><small>РУБЛИ:</small><br><span class="val rub" id="rub-val">0 ₽</span></div>
</div>

<div class="quest-box" id="quest-area">
    <b>ТЕКУЩЕЕ ЗАДАНИЕ:</b> <span id="q-desc">Собери 5,000 ₽ на новую мышку.</span>
    <br><small>Награда: +0.0005 BTC к клику</small>
</div>

<div class="main-hub">
    <button id="hack-btn" onclick="doHack()">ВЗЛОМ</button>
    <div class="temp-wrapper">
        <small>CPU TEMP: <span id="temp-num">30</span>°C</small>
        <div class="temp-bg"><div id="temp-fill"></div></div>
    </div>
    <button onclick="exchange()" style="margin-top: 15px; background: var(--gold); border: none; padding: 5px 10px; font-weight: bold; cursor: pointer;">ОБМЕНЯТЬ КРИПТУ</button>
</div>

<div class="bottom-panel" id="shop">
    </div>

<script>
    let state = {
        btc: 0, rub: 0,
        temp: 30,
        clickPower: 0.0002,
        income: 0,
        cooling: 0.4,
        locIdx: 0,
        questIdx: 0,
        isLock: false
    };

    const locations = [
        { name: "ПОДВАЛ МАМКИ", bonus: 0, cost: 0, cool: 0.4 },
        { name: "СЪЕМНАЯ ХАТА", bonus: 1000, cost: 50000, cool: 0.7 },
        { name: "ОФИС В СИТИ", bonus: 5000, cost: 500000, cool: 1.2 },
        { name: "БУНКЕР В ИСЛАНДИИ", bonus: 20000, cost: 5000000, cool: 3.0 }
    ];

    const quests = [
        { desc: "Собери 5,000 ₽ на новую мышку.", goal: () => state.rub >= 5000, reward: () => { state.clickPower += 0.0005; } },
        { desc: "Намайни 0.01 BTC.", goal: () => state.btc >= 0.01, reward: () => { state.rub += 20000; } },
        { desc: "Переедь из подвала.", goal: () => state.locIdx > 0, reward: () => { state.income += 1000; } }
    ];

    const upgrades = [
        { name: "Видеокарта (БУ)", cost: 2000, effect: () => state.clickPower += 0.0003 },
        { name: "Вентилятор", cost: 5000, effect: () => state.cooling += 0.3 },
        { name: "Майнер S9", cost: 15000, effect: () => state.income += 300 },
        { name: "Переезд", cost: 50000, effect: () => move() }
    ];

    function doHack() {
        if (state.isLock) return;
        state.btc += state.clickPower;
        state.temp += 2.5;
        if (state.temp >= 100) triggerOverheat();
        updateUI();
    }

    function triggerOverheat() {
        state.isLock = true;
        document.getElementById('hack-btn').classList.add('overheat');
        setTimeout(() => {
            state.isLock = false;
            state.temp = 40;
            document.getElementById('hack-btn').classList.remove('overheat');
        }, 5000);
    }

    function exchange() {
        let rate = 8000000 + (Math.random() * 2000000);
        state.rub += state.btc * rate;
        state.btc = 0;
        updateUI();
    }

    function move() {
        if (state.locIdx < locations.length - 1) {
            state.locIdx++;
            state.cooling = locations[state.locIdx].cool;
        }
    }

    function buy(i) {
        let up = upgrades[i];
        let price = up.id === 'move' ? locations[state.locIdx+1].cost : up.cost;
        
        if (state.rub >= up.cost) {
            state.rub -= up.cost;
            up.effect();
            up.cost = Math.floor(up.cost * 1.6);
            renderShop();
            updateUI();
        }
    }

    function updateUI() {
        document.getElementById('btc-val').innerText = state.btc.toFixed(5);
        document.getElementById('rub-val').innerText = Math.floor(state.rub).toLocaleString() + " ₽";
        document.getElementById('temp-num').innerText = Math.floor(state.temp);
        document.getElementById('temp-fill').style.width = state.temp + "%";
        document.getElementById('income-display').innerText = `${state.income} ₽/с`;
        
        // Квесты
        if (state.questIdx < quests.length) {
            let q = quests[state.questIdx];
            document.getElementById('q-desc').innerText = q.desc;
            if (q.goal()) {
                q.reward();
                state.questIdx++;
            }
        } else {
            document.getElementById('quest-area').innerText = "ВСЕ КВЕСТЫ ВЫПОЛНЕНЫ! ТЫ ЛЕГЕНДА.";
        }

        // Локация
        let loc = locations[state.locIdx];
        document.getElementById('loc-name').innerText = loc.name;
        document.getElementById('loc-bonus').innerText = `Охлаждение: ${loc.cool} | Пассив: +${loc.bonus} ₽`;
    }

    function renderShop() {
        const shop = document.getElementById('shop');
        shop.innerHTML = '';
        upgrades.forEach((u, i) => {
            let displayCost = u.name === "Переезд" && locations[state.locIdx+1] ? locations[state.locIdx+1].cost : u.cost;
            shop.innerHTML += `
                <div class="upgrade-card">
                    <div>
                        <p class="u-name">${u.name}</p>
                        <p class="u-desc">Цена: ${displayCost.toLocaleString()} ₽</p>
                    </div>
                    <button class="buy-btn" ${state.rub >= displayCost ? '' : 'disabled'} onclick="buy(${i})">КУПИТЬ</button>
                </div>
            `;
        });
    }

    setInterval(() => {
        if (!state.isLock) state.temp = Math.max(30, state.temp - state.cooling);
        state.rub += (state.income + locations[state.locIdx].bonus) / 10;
        updateUI();
        renderShop();
    }, 100);

    renderShop();
</script>
</body>
</html>
