<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PENTAGON BREAKER: MONEY EDITION</title>
    <style>
        :root { --neon: #00ff41; --dark: #050505; --gold: #ffd700; --red: #ff3300; }
        body { background: var(--dark); color: var(--neon); font-family: 'Courier New', monospace; margin: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        
        .header { padding: 8px; border-bottom: 2px solid var(--neon); display: flex; justify-content: space-between; background: #000; font-size: 11px; }
        
        .bank { display: grid; grid-template-columns: 1fr 1fr; padding: 10px; background: rgba(0,40,0,0.3); border-bottom: 1px solid var(--neon); gap: 10px; }
        .money-box { text-align: center; border: 1px solid rgba(0,255,65,0.3); padding: 5px; border-radius: 5px; }
        .val { font-size: 18px; font-weight: bold; color: var(--neon); display: block; }
        .rub { color: var(--gold); }
        .label { font-size: 9px; opacity: 0.7; text-transform: uppercase; }

        .exchange-section { padding: 10px; background: #111; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--neon); }
        #rate-display { font-size: 12px; color: var(--gold); }
        .ex-btn { background: var(--gold); color: #000; border: none; padding: 5px 15px; font-weight: bold; cursor: pointer; border-radius: 3px; font-size: 12px; }
        .ex-btn:active { transform: scale(0.9); }

        .main { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        #hack-btn { 
            width: 150px; height: 150px; border-radius: 50%; border: 4px solid var(--neon); 
            background: none; color: var(--neon); font-size: 22px; font-weight: bold; 
            cursor: pointer; box-shadow: 0 0 20px var(--neon); transition: 0.1s;
            -webkit-tap-highlight-color: transparent;
        }
        #hack-btn:active { background: var(--neon); color: #000; transform: scale(0.9); }

        .shop { height: 45vh; background: rgba(0,10,0,0.95); border-top: 2px solid var(--neon); overflow-y: auto; padding: 10px; }
        .item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #003300; }
        .item-info h4 { margin: 0; font-size: 14px; color: var(--gold); }
        .item-info p { margin: 0; font-size: 10px; color: #00ff41; opacity: 0.8; }
        .buy-btn { background: var(--neon); color: #000; border: none; padding: 8px 10px; font-weight: bold; cursor: pointer; min-width: 90px; border-radius: 3px; }
        .buy-btn:disabled { background: #003300; color: #005500; cursor: not-allowed; }

        #notify { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); background: var(--gold); color: #000; padding: 10px; display: none; z-index: 1000; font-weight: bold; font-size: 12px; width: 80%; text-align: center; box-shadow: 0 0 20px var(--gold); }
        .temp-bar { width: 150px; height: 4px; background: #222; margin-top: 10px; }
        #temp-fill { width: 0%; height: 100%; background: var(--neon); }
    </style>
</head>
<body>

<div id="notify">ДОСТИЖЕНИЕ!</div>

<div class="header">
    <span>USER: ROOT_HACKER</span>
    <span id="save-tag">AUTO_SAVE: ON</span>
</div>

<div class="bank">
    <div class="money-box">
        <span class="label">Крипто-кошелек</span>
        <span class="val" id="btc-display">0.000000 BTC</span>
    </div>
    <div class="money-box">
        <span class="label">Баланс (Карта)</span>
        <span class="val rub" id="rub-display">0 ₽</span>
    </div>
</div>

<div class="exchange-section">
    <div id="rate-display">Курс: 1 BTC = 7,420,000 ₽</div>
    <button class="ex-btn" onclick="exchange()">ОБМЕНЯТЬ ВСЁ</button>
</div>

<div class="main">
    <button id="hack-btn" onclick="hack(event)">ВЗЛОМ</button>
    <div class="temp-bar"><div id="temp-fill"></div></div>
    <p style="font-size: 10px; margin-top: 5px;">CPU TEMP: <span id="temp-val">30</span>°C</p>
</div>

<div class="shop" id="shop-list">
    </div>

<script>
    let state = {
        btc: 0,
        rub: 0,
        rate: 7000000,
        temp: 30,
        clickPower: 0.00001,
        income: 0, // Пассивный доход в рублях
        cooling: 0.3,
        achieved: []
    };

    const shopItems = [
        { id: 'gpu', name: 'RTX 5090 Ti', desc: '+0.00005 BTC/клик', cost: 150000 },
        { id: 'farm', name: 'Майнинг Ферма', desc: '+500 ₽/сек пассивно', cost: 500000 },
        { id: 'ai', name: 'Нейро-Бот', desc: '+0.001 BTC/клик', cost: 2500000 },
        { id: 'server', name: 'Дата-центр', desc: '+15,000 ₽/сек пассивно', cost: 10000000 },
        { id: 'nitro', name: 'Азотное охлад.', desc: 'Быстрое остывание', cost: 50000 }
    ];

    function hack(e) {
        if (state.temp >= 100) return;
        state.btc += state.clickPower;
        state.temp += 1.5;
        if (navigator.vibrate) navigator.vibrate(20);
        updateUI();
    }

    function exchange() {
        if (state.btc <= 0) return;
        let gained = state.btc * state.rate;
        state.rub += gained;
        state.btc = 0;
        if (navigator.vibrate) navigator.vibrate([30, 30]);
        updateUI();
        save();
    }

    function buy(index) {
        const item = shopItems[index];
        if (state.rub >= item.cost) {
            state.rub -= item.cost;
            
            // Логика улучшений
            if (item.id === 'gpu') state.clickPower += 0.00005;
            if (item.id === 'farm') state.income += 500;
            if (item.id === 'ai') state.clickPower += 0.001;
            if (item.id === 'server') state.income += 15000;
            if (item.id === 'nitro') state.cooling += 0.5;

            item.cost = Math.floor(item.cost * 1.6);
            renderShop();
            updateUI();
            save();
        }
    }

    function updateUI() {
        document.getElementById('btc-display').innerText = state.btc.toFixed(6) + " BTC";
        document.getElementById('rub-display').innerText = Math.floor(state.rub).toLocaleString() + " ₽";
        document.getElementById('rate-display').innerText = `Курс: 1 BTC = ${Math.floor(state.rate).toLocaleString()} ₽`;
        document.getElementById('temp-val').innerText = Math.floor(state.temp);
        document.getElementById('temp-fill').style.width = state.temp + "%";
        
        if (state.temp > 85) document.getElementById('temp-fill').style.background = "var(--red)";
        else document.getElementById('temp-fill').style.background = "var(--neon)";
    }

    function renderShop() {
        const list = document.getElementById('shop-list');
        list.innerHTML = '';
        shopItems.forEach((item, i) => {
            const canBuy = state.rub >= item.cost;
            list.innerHTML += `
                <div class="item">
                    <div class="item-info">
                        <h4>${item.name}</h4>
                        <p>${item.desc}</p>
                    </div>
                    <button class="buy-btn" ${canBuy ? '' : 'disabled'} onclick="buy(${i})">
                        ${item.cost.toLocaleString()} ₽
                    </button>
                </div>
            `;
        });
    }

    // Игровой цикл
    setInterval(() => {
        // Остывание
        state.temp = Math.max(30, state.temp - state.cooling);
        
        // Пассивный доход (рубли капают)
        state.rub += state.income / 10;

        // Скачки курса
        state.rate += (Math.random() - 0.5) * 50000;
        if (state.rate < 4000000) state.rate = 4000000;

        if (state.temp >= 100) {
            state.temp = 35;
            alert("ПЕРЕГРЕВ! Система перезагружена.");
        }

        updateUI();
    }, 100);

    // Достижения
    setInterval(() => {
        if (state.rub > 1000000 && !state.achieved.includes('million')) {
            showNotify("МИЛЛИОНЕР: Твои хакерские дела идут в гору!");
            state.achieved.push('million');
        }
    }, 2000);

    function showNotify(text) {
        const n = document.getElementById('notify');
        n.innerText = text;
        n.style.display = 'block';
        setTimeout(() => n.style.display = 'none', 4000);
    }

    function save() { localStorage.setItem('hackMoneySave', JSON.stringify({state, shopItems})); }
    function load() {
        const d = localStorage.getItem('hackMoneySave');
        if (d) {
            const p = JSON.parse(d);
            state = p.state;
            p.shopItems.forEach((u, i) => shopItems[i].cost = u.cost);
        }
    }

    load();
    renderShop();
    updateUI();
</script>

</body>
</html>
