<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PENTAGON BREAKER: EASY MONEY</title>
    <style>
        :root { --neon: #00ff41; --dark: #050505; --gold: #ffd700; }
        body { background: var(--dark); color: var(--neon); font-family: sans-serif; margin: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        .header { padding: 8px; border-bottom: 2px solid var(--neon); display: flex; justify-content: space-between; font-size: 11px; background: #000; }
        .bank { display: grid; grid-template-columns: 1fr 1fr; padding: 10px; background: rgba(0,40,0,0.3); border-bottom: 1px solid var(--neon); gap: 10px; }
        .money-box { text-align: center; border: 1px solid rgba(0,255,65,0.3); padding: 5px; }
        .val { font-size: 18px; font-weight: bold; color: var(--neon); display: block; }
        .rub { color: var(--gold); }
        .label { font-size: 9px; opacity: 0.7; }
        .exchange-section { padding: 10px; background: #111; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--neon); }
        .ex-btn { background: var(--gold); color: #000; border: none; padding: 8px 15px; font-weight: bold; cursor: pointer; border-radius: 5px; }
        .main { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #hack-btn { 
            width: 140px; height: 140px; border-radius: 50%; border: 4px solid var(--neon); 
            background: none; color: var(--neon); font-size: 20px; font-weight: bold; 
            box-shadow: 0 0 15px var(--neon); cursor: pointer;
        }
        #hack-btn:active { transform: scale(0.9); background: var(--neon); color: #000; }
        .shop { height: 45vh; background: #000; border-top: 2px solid var(--neon); overflow-y: auto; padding: 10px; }
        .item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #003300; }
        .item-info h4 { margin: 0; font-size: 14px; color: var(--gold); }
        .item-info p { margin: 0; font-size: 11px; color: var(--neon); }
        .buy-btn { background: var(--neon); color: #000; border: none; padding: 8px; font-weight: bold; min-width: 80px; }
        .buy-btn:disabled { opacity: 0.3; }
        #temp-fill { height: 4px; background: var(--neon); width: 0%; transition: 0.1s; margin-top: 10px; width: 150px; }
    </style>
</head>
<body>

<div class="header"><span>SYSTEM: STABLE</span><span id="income-tag">Доход: 0 ₽/с</span></div>

<div class="bank">
    <div class="money-box"><span class="label">КРИПТА</span><span class="val" id="btc-val">0.00000</span></div>
    <div class="money-box"><span class="label">РУБЛИ</span><span class="val rub" id="rub-val">0 ₽</span></div>
</div>

<div class="exchange-section">
    <div id="rate-display" style="font-size: 12px;">1 BTC = 10,000,000 ₽</div>
    <button class="ex-btn" onclick="exchange()">ОБМЕНЯТЬ</button>
</div>

<div class="main">
    <button id="hack-btn" onclick="hack()">ВЗЛОМ</button>
    <div style="width: 150px; background: #222; height: 4px; margin-top: 10px;">
        <div id="temp-fill"></div>
    </div>
</div>

<div class="shop" id="shop-list"></div>

<script>
    let state = {
        btc: 0, rub: 0, 
        rate: 10000000, 
        temp: 0, 
        clickPower: 0.0001, // В 10 раз больше, чем было
        income: 0, 
        cooling: 0.5
    };

    const items = [
        { id: 'gpu', name: 'Б/У Видяха', desc: '+0.0002 BTC/кл', cost: 1000 },
        { id: 'gpu2', name: 'Игровая карта', desc: '+0.001 BTC/кл', cost: 15000 },
        { id: 'farm', name: 'Асик-майнер', desc: '+200 ₽/сек', cost: 50000 },
        { id: 'office', name: 'Хакер-спейс', desc: '+2000 ₽/сек', cost: 300000 },
        { id: 'super', name: 'Квантовый ПК', desc: '+0.05 BTC/кл', cost: 1500000 }
    ];

    function hack() {
        if (state.temp >= 100) return;
        state.btc += state.clickPower;
        state.temp = Math.min(100, state.temp + 2);
        updateUI();
    }

    function exchange() {
        state.rub += state.btc * state.rate;
        state.btc = 0;
        updateUI();
    }

    function buy(i) {
        if (state.rub >= items[i].cost) {
            state.rub -= items[i].cost;
            if (items[i].id === 'gpu') state.clickPower += 0.0002;
            if (items[i].id === 'gpu2') state.clickPower += 0.001;
            if (items[i].id === 'farm') state.income += 200;
            if (items[i].id === 'office') state.income += 2000;
            if (items[i].id === 'super') state.clickPower += 0.05;
            items[i].cost = Math.floor(items[i].cost * 1.4);
            renderShop();
            updateUI();
        }
    }

    function updateUI() {
        document.getElementById('btc-val').innerText = state.btc.toFixed(5);
        document.getElementById('rub-val').innerText = Math.floor(state.rub).toLocaleString() + " ₽";
        document.getElementById('temp-fill').style.width = state.temp + "%";
        document.getElementById('income-tag').innerText = `Доход: ${state.income} ₽/с`;
        document.getElementById('rate-display').innerText = `Курс: 1 BTC = ${Math.floor(state.rate).toLocaleString()} ₽`;
    }

    function renderShop() {
        const list = document.getElementById('shop-list');
        list.innerHTML = '';
        items.forEach((item, i) => {
            list.innerHTML += `
                <div class="item">
                    <div class="item-info"><h4>${item.name}</h4><p>${item.desc}</p></div>
                    <button class="buy-btn" ${state.rub >= item.cost ? '' : 'disabled'} onclick="buy(${i})">${item.cost.toLocaleString()} ₽</button>
                </div>
            `;
        });
    }

    setInterval(() => {
        state.temp = Math.max(0, state.temp - state.cooling);
        state.rub += state.income / 10;
        state.rate += (Math.random() - 0.5) * 100000;
        updateUI();
        renderShop();
    }, 100);

    renderShop();
</script>
</body>
</html>
