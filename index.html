<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HACKER: HARDCORE ECONOMY</title>
    <style>
        :root { --n: #00ff41; --bg: #050505; --g: #ffd700; --r: #ff3131; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--n); font-family: 'Consolas', monospace; margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .header { padding: 5px 10px; border-bottom: 1px solid var(--n); display: flex; justify-content: space-between; font-size: 10px; background: #000; }
        .stats { display: grid; grid-template-columns: 1fr 1fr; padding: 15px; background: #080808; border-bottom: 2px solid var(--n); }
        .val { font-size: 20px; font-weight: bold; color: var(--n); }
        .rub { color: var(--g); }

        /* Донат */
        .donate-area { background: #111; padding: 10px; border-bottom: 1px solid var(--g); display: flex; justify-content: space-between; align-items: center; }
        .d-btn { background: var(--g); color: #000; border: none; padding: 6px 12px; font-weight: bold; cursor: pointer; border-radius: 2px; font-size: 11px; }

        .main { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        #btn { 
            width: 140px; height: 140px; border-radius: 50%; border: 5px solid var(--n); 
            background: none; color: var(--n); font-size: 20px; font-weight: bold; 
            cursor: pointer; box-shadow: 0 0 15px var(--n); transition: 0.1s;
        }
        #btn:active { transform: scale(0.9); box-shadow: 0 0 40px var(--n); }
        #btn.disabled { border-color: #333; color: #333; box-shadow: none; cursor: not-allowed; }

        .temp-ui { width: 200px; margin-top: 20px; text-align: center; }
        .t-bar { width: 100%; height: 10px; background: #111; border: 1px solid var(--n); margin-top: 5px; }
        #t-fill { width: 0%; height: 100%; background: var(--n); transition: 0.4s; }

        .shop { height: 40vh; background: #000; border-top: 2px solid var(--n); overflow-y: auto; }
        .item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #111; }
        .item h4 { margin: 0; font-size: 13px; color: var(--g); }
        .item p { margin: 2px 0 0; font-size: 10px; opacity: 0.6; }
        .buy { background: var(--n); color: #000; border: none; padding: 8px 15px; font-weight: bold; cursor: pointer; }
        .buy:disabled { background: #222; color: #444; }

        #modal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; border: 2px solid var(--g); margin: 20px; text-align: center; }
    </style>
</head>
<body>

<div id="modal">
    <h2 style="color:var(--g)">DONATE TERMINAL</h2>
    <p>Для активации VIP (x10) переведи на карту:</p>
    <div style="background:#222; padding:15px; color:var(--g); font-size:16px; margin:15px 0">2202 2036 4104 0342</div>
    <button class="d-btn" style="width:200px" onclick="checkPay()">ПРОВЕРИТЬ ОПЛАТУ</button>
    <button onclick="document.getElementById('modal').style.display='none'" style="background:none; border:none; color:var(--r); margin-top:20px">ЗАКРЫТЬ</button>
</div>

<div class="header">
    <span>ВЕРСИЯ: 4.0 (HARDCORE)</span>
    <span id="income-tag">ДОХОД: 0 ₽/с</span>
</div>

<div class="donate-area">
    <span id="vip-tag" style="font-size:10px">STATUS: GUEST</span>
    <button class="d-btn" onclick="document.getElementById('modal').style.display='flex'">VIP БУСТ</button>
</div>

<div class="stats">
    <div><small>BITCOIN</small><br><span class="val" id="btc">0.00000</span></div>
    <div style="text-align:right;"><small>РУБЛИ</small><br><span class="val rub" id="rub">0</span></div>
</div>

<div class="main">
    <button id="btn" onclick="hk()">ВЗЛОМ</button>
    <div class="temp-ui">
        <small>CPU TEMP: <span id="tv">30</span>°C</small>
        <div class="t-bar"><div id="t-fill"></div></div>
        <button onclick="ex()" style="margin-top:15px; background:var(--g); border:none; padding:8px 20px; font-weight:bold; cursor:pointer; width:100%">ОБМЕН BTC (КУРС ПЛАВАЕТ)</button>
    </div>
</div>

<div class="shop" id="shop"></div>

<script>
    let s = { btc: 0, rub: 100, t: 30, cp: 0.00002, inc: 0, cool: 0.3, mult: 1, vip: 1 };

    const items = [
        { n: "Термопаста", cost: 500, fn: () => s.cool += 0.2, d: "+0.2 Охлад" },
        { n: "Старая Видяха", cost: 1500, fn: () => s.cp += 0.00005, d: "+0.00005 BTC" },
        { n: "Доп. Вентилятор", cost: 5000, fn: () => s.cool += 0.6, d: "+0.6 Охлад" },
        { n: "Майнер S7", cost: 15000, fn: () => s.inc += 150, d: "+150 ₽/с" },
        { n: "ASIC Майнер", cost: 80000, fn: () => s.inc += 900, d: "+900 ₽/с" },
        { n: "Серверная Стойка", cost: 450000, fn: () => s.inc += 6000, d: "+6000 ₽/с" },
        { n: "Квантовое ядро", cost: 2500000, fn: () => s.cp += 0.005, d: "+0.005 BTC" }
    ];

    function hk() {
        if (s.t >= 100) return;
        s.btc += s.cp * s.mult * s.vip;
        s.t = Math.min(100, s.t + 1.8);
        u();
    }

    function ex() {
        if (s.btc < 0.0001) return alert("Минимум 0.0001 BTC!");
        let rate = 4000000 + (Math.random() * 3000000); // Курс стал ниже
        s.rub += s.btc * rate;
        s.btc = 0;
        u(); rs();
    }

    function buy(i) {
        if (s.rub >= items[i].cost) {
            s.rub -= items[i].cost;
            items[i].fn();
            items[i].cost = Math.floor(items[i].cost * 2.2); // Цена растет ОЧЕНЬ быстро
            u(); rs();
        }
    }

    function checkPay() {
        alert("Проверка... VIP активирован (x10)!");
        s.vip = 10;
        document.getElementById('vip-tag').innerText = "STATUS: VIP (x10)";
        document.getElementById('vip-tag').style.color = "var(--g)";
        document.getElementById('modal').style.display = 'none';
        u();
    }

    function u() {
        document.getElementById('btc').innerText = s.btc.toFixed(5);
        document.getElementById('rub').innerText = Math.floor(s.rub).toLocaleString() + " ₽";
        document.getElementById('tv').innerText = Math.floor(s.t);
        document.getElementById('t-fill').style.width = s.t + "%";
        document.getElementById('income-tag').innerText = `ДОХОД: ${s.inc} ₽/с`;
        
        const b = document.getElementById('btn');
        if (s.t >= 100) { b.classList.add('disabled'); b.innerText = "OVERHEAT"; }
        else { b.classList.remove('disabled'); b.innerText = "ВЗЛОМ"; }
    }

    function rs() {
        const sh = document.getElementById('shop');
        sh.innerHTML = '';
        items.forEach((item, i) => {
            sh.innerHTML += `
                <div class="item">
                    <div><h4>${item.n}</h4><p>${item.d} | Цена: ${item.cost.toLocaleString()} ₽</p></div>
                    <button class="buy" ${s.rub >= item.cost ? '' : 'disabled'} onclick="buy(${i})">КУПИТЬ</button>
                </div>`;
        });
    }

    setInterval(() => {
        s.t = Math.max(30, s.t - s.cool);
        s.rub += s.inc / 10; // Доход пассивный раз в 100мс, но он теперь меньше сам по себе
        u();
    }, 100);

    rs(); u();
</script>
</body>
</html>
