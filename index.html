<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HACKER TYCOON: REBORN</title>
    <style>
        :root { --n: #00ff41; --bg: #050505; --g: #ffd700; --r: #ff3131; --b: #00d4ff; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--n); font-family: 'Segoe UI', monospace; margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Верхняя панель */
        .top { display: grid; grid-template-columns: 1fr 1fr; background: #000; border-bottom: 2px solid var(--n); padding: 10px; font-weight: bold; }
        .loc-tag { grid-column: 1 / 3; text-align: center; color: var(--b); font-size: 12px; padding-bottom: 5px; border-bottom: 1px solid #111; margin-bottom: 5px; }

        /* Центр */
        .hub { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        #btn { 
            width: 140px; height: 140px; border-radius: 50%; border: 4px solid var(--n); 
            background: none; color: var(--n); font-size: 20px; font-weight: bold; 
            cursor: pointer; box-shadow: 0 0 15px var(--n); transition: 0.05s;
        }
        #btn:active { transform: scale(0.92); background: var(--n); color: #000; }
        
        .temp-cont { width: 180px; margin-top: 15px; }
        .t-bg { width: 100%; height: 6px; background: #222; border: 1px solid var(--n); }
        #t-fill { width: 0%; height: 100%; background: var(--n); }

        /* Квесты */
        .q-box { width: 90%; background: #0a0a0a; border-left: 4px solid var(--b); padding: 10px; margin: 10px auto; font-size: 11px; }

        /* Магазин */
        .shop { height: 45vh; background: #000; border-top: 2px solid var(--n); overflow-y: auto; padding: 5px; }
        .card { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #111; }
        .c-info h4 { margin: 0; font-size: 13px; color: var(--g); }
        .c-info p { margin: 0; font-size: 10px; color: #0f0; opacity: 0.7; }
        .buy { background: var(--n); color: #000; border: none; padding: 8px 12px; font-weight: bold; font-size: 11px; border-radius: 2px; }
        .buy:disabled { opacity: 0.2; }

        /* Глитч при перегреве */
        .err { animation: shake 0.1s infinite; border-color: var(--r) !important; color: var(--r) !important; }
        @keyframes shake { 0% { transform: translate(1px,1px); } 50% { transform: translate(-1px,-1px); } }
    </style>
</head>
<body>

<div class="top">
    <div class="loc-tag" id="loc">ПОДВАЛ МАМКИ (Охлад: х1.0)</div>
    <div>BTC: <span id="btc">0.00000</span></div>
    <div style="text-align: right;">₽: <span id="rub" style="color:var(--g)">0</span></div>
</div>

<div class="q-box" id="qb">
    <b>ЗАДАНИЕ:</b> <span id="qt">Купи первую видяху!</span><br>
    <small id="qr">Награда: +500 ₽</small>
</div>

<div class="hub">
    <button id="btn" onclick="hk()">ВЗЛОМ</button>
    <div class="temp-cont">
        <small>TEMP: <span id="tv">30</span>°C</small>
        <div class="t-bg"><div id="t-fill"></div></div>
    </div>
    <button onclick="ex()" style="margin-top:15px; background:var(--g); border:none; padding:8px 20px; font-weight:bold;">ОБМЕНЯТЬ КРИПТУ</button>
</div>

<div class="shop" id="sh"></div>

<script>
    let s = { btc: 0, rub: 100, t: 30, cp: 0.0001, inc: 0, cool: 0.4, loc: 0, qi: 0, lock: false };

    const locs = [
        { n: "ПОДВАЛ МАМКИ", c: 1.0, cost: 0 },
        { n: "СЪЕМНАЯ ХАТА", c: 2.5, cost: 15000 },
        { n: "ОФИС В СИТИ", c: 6.0, cost: 250000 },
        { n: "ДАТА-ЦЕНТР", c: 15.0, cost: 2000000 }
    ];

    const q = [
        { t: "Накопи на Б/У Видеокарту", g: () => s.rub >= 1000, r: () => { s.rub += 500; }, rt: "+500 ₽" },
        { t: "Намайни 0.001 BTC", g: () => s.btc >= 0.001, r: () => { s.cp += 0.0005; }, rt: "+Клик" },
        { t: "Сделай первый обмен", g: () => s.rub >= 5000, r: () => { s.rub += 2000; }, rt: "+2000 ₽" },
        { t: "Купи Термопасту", g: () => s.cool > 0.5, r: () => { s.rub += 5000; }, rt: "+5000 ₽" },
        { t: "Переедь из подвала", g: () => s.loc > 0, r: () => { s.inc += 200; }, rt: "+200 ₽/с" },
        { t: "Стань крипто-лордом (0.1 BTC)", g: () => s.btc >= 0.1, r: () => { s.inc += 5000; }, rt: "+5000 ₽/с" }
    ];

    const up = [
        { n: "Б/У Видеокарта", cost: 1000, fn: () => s.cp += 0.0002 },
        { n: "Термопаста MX-4", cost: 3000, fn: () => s.cool += 0.3 },
        { n: "Майнер Antminer", cost: 12000, fn: () => s.inc += 150 },
        { n: "Wi-Fi Роутер 6E", cost: 25000, fn: () => s.cp *= 1.5 },
        { n: "Переезд (Новая Лок)", cost: 15000, fn: () => move() },
        { n: "Серверная Стойка", cost: 100000, fn: () => s.inc += 1200 }
    ];

    function hk() {
        if (s.lock) return;
        s.btc += s.cp;
        s.t += 1.8;
        if (s.t >= 100) {
            s.lock = true;
            document.getElementById('btn').classList.add('err');
            setTimeout(() => { s.lock = false; s.t = 40; document.getElementById('btn').classList.remove('err'); }, 4000);
        }
        u();
    }

    function ex() {
        let rate = 7000000 + (Math.random() * 3000000);
        s.rub += s.btc * rate;
        s.btc = 0;
        u();
    }

    function move() {
        if (s.loc < locs.length - 1) {
            s.loc++;
            s.cool *= locs[s.loc].c;
            up[4].cost = locs[s.loc+1] ? locs[s.loc+1].cost : 999999999;
        }
    }

    function buy(i) {
        if (s.rub >= up[i].cost) {
            s.rub -= up[i].cost;
            up[i].fn();
            if (up[i].n !== "Переезд (Новая Лок)") up[i].cost = Math.floor(up[i].cost * 1.8);
            rs(); u();
        }
    }

    function u() {
        document.getElementById('btc').innerText = s.btc.toFixed(5);
        document.getElementById('rub').innerText = Math.floor(s.rub).toLocaleString();
        document.getElementById('tv').innerText = Math.floor(s.t);
        document.getElementById('t-fill').style.width = s.t + "%";
        document.getElementById('loc').innerText = `${locs[s.loc].n} (Охлад: х${locs[s.loc].c})`;
        
        if (s.qi < q.length) {
            let cur = q[s.qi];
            document.getElementById('qt').innerText = cur.t;
            document.getElementById('qr').innerText = `Награда: ${cur.rt}`;
            if (cur.g()) { cur.r(); s.qi++; u(); }
        } else {
            document.getElementById('qb').innerHTML = "<b>ВСЕ КВЕСТЫ ВЫПОЛНЕНЫ!</b>";
        }
    }

    function rs() {
        const sh = document.getElementById('sh');
        sh.innerHTML = '';
        up.forEach((u_item, i) => {
            let d_cost = u_item.cost;
            sh.innerHTML += `
                <div class="card">
                    <div class="c-info"><h4>${u_item.n}</h4><p>Цена: ${d_cost.toLocaleString()} ₽</p></div>
                    <button class="buy" ${s.rub >= d_cost ? '' : 'disabled'} onclick="buy(${i})">КУПИТЬ</button>
                </div>`;
        });
    }

    setInterval(() => {
        if (!s.lock) s.t = Math.max(30, s.t - s.cool);
        s.rub += s.inc / 10;
        u();
        // Обновляем доступность кнопок реже, для оптимизации
    }, 100);

    setInterval(rs, 1000); // Перерисовка магазина раз в сек

    rs(); u();
</script>
</body>
</html>
